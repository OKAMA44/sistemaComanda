<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido — Comanda</title>
<style>
  :root {
    --bg: #f3f5f4; --surface: #ffffff; --ink: #1b2b2a; --muted: #5d6e6b; --line: #d5dbd8;
    --accent: #0f6e66; --danger: #b4432f; --ok-bg: #dff1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a19; --surface: #1b2625; --ink: #e6efed; --muted: #93a6a2; --line: #2f3d3b;
      --accent: #3fb5a8; --danger: #e5796a; --ok-bg: #1c3a36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { margin: 0; font-size: 1.25rem; }
  main { max-width: 700px; margin: 0 auto; padding: 16px; }
  a.voltar { color: var(--accent); text-decoration: none; display: inline-block; margin-bottom: 12px; }
  a.voltar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .85rem; background: var(--ok-bg); font-weight: 400; }
  .badge.closed { background: var(--line); color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; font-size: .9rem; color: var(--muted); }
  .num { text-align: right; white-space: nowrap; }
  .total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; padding-top: 12px; }
  .msg { color: var(--muted); }
  .msg.erro { color: var(--danger); }
</style>
</head>
<body>

<header><h1>Comanda</h1></header>

<main>
  <a class="voltar" href="index.html#pedidos">&larr; Voltar aos pedidos</a>
  <div id="conteudo"><p class="msg">Carregando…</p></div>
</main>

<script>
  // Servido pelo Spring: caminho relativo. Aberto do disco (file://): aponta para o backend local.
  const API = location.protocol === 'file:' ? 'http://localhost:8080/api' : '/api';

  const brl = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Data vem como "2026-10-17" (ISO); mostra como 17/10/2026 sem mexer em fuso horário.
  const dataBr = (iso) => (iso ? iso.split('-').reverse().join('/') : '—');

  const conteudo = document.getElementById('conteudo');

  function mostrarErro(msg) {
    conteudo.innerHTML = `<p class="msg erro">${esc(msg)}</p>`;
  }

  function desenhar(p) {
    document.title = `Mesa ${p.mesa} — Comanda`;
    const linhas = p.itens.map((i) => `
      <tr>
        <td>${esc(i.produto)}</td>
        <td class="num">${i.quantidade}</td>
        <td class="num">${brl(i.valorUnitario)}</td>
        <td class="num">${brl(i.valorUnitario * i.quantidade)}</td>
      </tr>`).join('');

    conteudo.innerHTML = `
      <section class="panel">
        <h2>
          <span>Mesa ${esc(p.mesa)}</span>
          <span class="badge ${p.status ? '' : 'closed'}">${p.status ? 'Aberto' : 'Fechado'}</span>
        </h2>
        <dl>
          <dt>Data</dt><dd>${esc(dataBr(p.data))}</dd>
          <dt>Garçom</dt><dd>${p.garcom ? esc(p.garcom) : 'Sem garçom'}</dd>
          <dt>Código</dt><dd>${esc(p.id)}</dd>
        </dl>
      </section>

      <section class="panel">
        <h2>Itens</h2>
        ${p.itens.length ? `
        <table>
          <thead><tr><th>Produto</th><th class="num">Qtd.</th><th class="num">Unitário</th><th class="num">Subtotal</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>` : '<p class="msg">Este pedido não tem itens.</p>'}
        <div class="total"><span>Total</span><span>${brl(p.valorTotal)}</span></div>
      </section>`;
  }

  async function carregar() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) return mostrarErro('Nenhum pedido informado.');
    try {
      const res = await fetch(API + '/pedidos/' + encodeURIComponent(id));
      if (res.status === 404) return mostrarErro('Pedido não encontrado.');
      if (!res.ok) return mostrarErro('Erro ' + res.status + ' ao carregar o pedido.');
      desenhar(await res.json());
    } catch (e) {
      mostrarErro('Não consegui falar com o servidor. Ele está rodando em localhost:8080?');
    }
  }

  carregar();
</script>
</body>
</html>
